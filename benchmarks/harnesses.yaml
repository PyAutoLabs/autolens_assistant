# Headless command templates for `benchmark.py run`. Placeholders: {prompt}, {workdir}, {model}, {run_dir}.
claude-code:
  command: ["claude", "-p", "{prompt}", "--output-format", "stream-json", "--verbose", "--model", "{model}", "--permission-mode", "bypassPermissions", "--max-turns", "150"]
  transcript: claude-stream-json
codex:
  # codex-cli 0.157 removed `--full-auto`; `--sandbox workspace-write` is its sandbox half
  # (writes confined to the workdir, network off). `codex exec` never prompts for approval.
  command: ["codex", "exec", "--json", "--sandbox", "workspace-write", "--model", "{model}", "{prompt}"]
  transcript: codex-jsonl
