# Colab Gemini instructions — which assistant skills travel with which notebook.
#
# Colab's Gemini sidebar cannot read this repository, but it honours per-notebook
# instructions stored in the notebook's metadata (`metadata.colab.aiContexts` +
# `selectedAiContext`). At release time PyAutoHands (`autohands/build_util.py`,
# `inject_gemini_instructions`) writes one such instruction into every generated
# autolens_workspace and HowToLens notebook, assembled from this file:
#
#     preface  +  rules (with {notebook} and {repo} filled in)  +  each mapped skill's text
#
# The skills stay here (single source); notebooks carry a release-time snapshot only.
#
# Matching
#   Each notebook is named "<repo>/<path relative to the repo root>", e.g.
#   "autolens_workspace/notebooks/imaging/modeling.ipynb" or
#   "HowToLens/notebooks/chapter_2_lens_modeling/tutorial_1_non_linear_search.ipynb".
#   `match` is an fnmatch glob over that name (`*` also crosses `/`).
#   The FIRST entry in `contexts` whose glob matches wins, so entries are written
#   most specific first. A notebook no entry matches gets `default`.
#
# Limits
#   Every assembled context must stay within 20,000 characters. Generation fails,
#   naming the entry, rather than truncating; `python -m autoassistant.colab_contexts
#   check` (CI: .github/workflows/colab-contexts.yml) checks every entry here first.
#   Skills listed under `never_map` (maintainer and agent-infrastructure skills that
#   only make sense with the repository checked out) may not be mapped.
#
# Upkeep: when a skill is added or renamed, or the workspace gains a folder, update
# the entries here and rerun the check; `autohands gemini_context report` lists the
# notebooks that only reach `default`. The maintainer skill
# skills/al_refresh_colab_contexts.md walks the whole refresh.

name: PyAutoLens assistant

# The project key the assistant's own notebooks (docs/colab/) are stamped with. It
# sets the instruction's id, so it matches the id PyAutoHands gives autolens_workspace.
project: autolens

preface: |
  These instructions were prepared by the PyAutoLens assistant
  (https://github.com/PyAutoLabs/autolens_assistant). The reference material at the
  end was written for a coding agent working inside a checkout of that repository.
  Here in Google Colab there is no checkout: ignore any step about repository files,
  hooks, `scripts/` or `wiki/` paths, saving scripts, or terminal tools, and use the
  PyAutoLens knowledge in that material to help with this notebook.

rules: |
  You are helping someone work through a PyAutoLens notebook ({notebook} in {repo}).
  Explain what it does and help them adapt it to their own questions.

  Core rules:
  1. Stay with this notebook's API. Only use PyAutoLens calls that appear in the
     notebook or in the reference material below. Never invent class names, functions
     or arguments. If you are unsure whether something exists, say so and suggest
     checking with `dir()` or the PyAutoLens docs (https://pyautolens.readthedocs.io).
  2. Real data needs a check first. Before helping fit real observational data, ask the
     user to plot it and confirm (a) whether extra galaxies, foreground stars or
     artefacts need masking or noise-scaling, and (b) a mask radius that contains all
     of the lensed emission. Never leave the mask radius at its default on real data.
     Simulated data from the workspace is exempt.
  3. Never claim a fit or a cell ran, or what it returned. Only the user's own outputs
     tell you that; ask them to share what they see.
  4. When the answer depends on something you do not know (their data, their goal, what
     a cell printed), ask one focused question rather than guessing.
  5. For multi-step projects (a new lens, a sample of lenses, a paper's analysis), point
     them to the PyAutoLens assistant https://github.com/PyAutoLabs/autolens_assistant,
     which runs in Claude Code or Codex with its full skills and safety checks.

never_map:
  - _bootstrap_skill
  - _style
  - al_audit_skill_apis
  - al_ingest_paper
  - al_inspect_results_mcp
  - al_profiling_setup
  - al_refresh_api_docs
  - al_refresh_colab_contexts
  - al_setup_environment
  - al_to_notebook
  - al_update_wiki
  - contribute-upstream
  - feedback
  - init-slam
  - start-new-project

default:
  skills: [al_build_imaging_model, al_run_search]

contexts:

  # --- This repository's own Colab notebook -------------------------------------
  - match: autolens_assistant/docs/colab/cosmos_web_ring_colab.ipynb
    skills: [al_greeting_cosmos_web_ring, al_inspect_source_reconstruction]

  # --- autolens_workspace: root ---------------------------------------------------
  - match: autolens_workspace/start_here.ipynb
    skills: [al_build_imaging_model, al_run_search]

  # --- autolens_workspace: features (most specific first) ------------------------
  - match: autolens_workspace/notebooks/*/features/advanced/subhalo/sensitivity/*
    skills: [al_sensitivity_mapping, al_subhalo_detect]
  - match: autolens_workspace/notebooks/*/features/advanced/subhalo/*
    skills: [al_subhalo_detect, al_chain_searches]
  - match: autolens_workspace/notebooks/*/features/advanced/potential_correction/*
