# Build the JOSS paper with the official Inara toolchain.
#
# JOSS papers are compiled by `openjournals/inara` (the same tool the journal
# runs at review time), which applies the branded JOSS template. Running it in
# CI is the canonical way to preview the paper — it needs no local Docker/LaTeX.
# The compiled PDF is uploaded as a workflow artifact ("paper-pdf"); download it
# from the run's Summary page.
#
# NOTE: this is the *draft* preview, so the PDF carries a DRAFT watermark and
# line numbers. The layout is otherwise identical to the accepted-paper build —
# if something looks wrong here, it is wrong in paper.md, not in the toolchain.
# Every figure referenced by paper.md must live under `paper/`; Inara mounts
# only that directory, so `../docs/...` paths do not resolve.
name: Draft JOSS PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Build JOSS draft PDF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF (Inara)
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
