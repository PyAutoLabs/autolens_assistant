# Build the JOSS paper with the official Inara toolchain.
#
# JOSS papers are compiled by `openjournals/inara` (the same tool the journal
# runs at review time), which applies the branded JOSS template. Running it in
# CI is the canonical way to preview the paper — it needs no local Docker/LaTeX.
#
# Two artifacts are produced, both downloadable from the run's Summary page:
#
#   paper-pdf        the reading copy — Inara's `-p` ("publishing") mode, which
#                    is what the accepted paper looks like.
#   paper-pdf-draft  the review copy — adds a DRAFT watermark and line numbers
#                    so reviewers can cite a line. The line numbers overlap the
#                    left-hand sidebar on page 1; that is a known cosmetic quirk
#                    of draft mode, not a fault in paper.md.
#
# Apart from the watermark and line numbers the two are laid out identically, so
# if something looks wrong in either, it is wrong in paper.md, not the toolchain.
#
# Every figure referenced by paper.md must live under `paper/`; Inara mounts only
# that directory, so `../docs/...` paths do not resolve.
name: Draft JOSS PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Build JOSS draft PDF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF (Inara)
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf-draft
          path: paper/paper.pdf

      # `-p` forces the publishing PDF: no DRAFT watermark, no line numbers, and
      # so no collision with the sidebar. The draft action offers no switch for
      # this, so call the image directly the way paper/README.md documents.
      - name: Build publishing PDF (Inara)
        run: |
          sudo rm -f paper/paper.pdf
          docker run --rm \
            --volume "${{ github.workspace }}/paper:/data" \
            --env JOURNAL=joss \
            openjournals/inara -p -o pdf paper.md
          sudo chown "$(id -u):$(id -g)" paper/paper.pdf

      - name: Upload publishing PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
